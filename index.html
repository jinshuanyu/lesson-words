  .eyebrow{display:inline-block;font-size:.8rem;font-weight:700;letter-spacing:.18em;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:.2rem .9rem;margin-bottom:.9rem}

  .grade{min-width:0}
  .grade{border:2px solid var(--c-border);background:#fff;border-radius:16px;padding:.9rem .5rem .8rem;text-align:center;color:inherit}

  .grade .g small{font-family:"Noto Sans TC",sans-serif;font-size:.8rem;font-weight:700;color:var(--c-muted);margin-left:.15rem}

  .open{align-self:flex-start;background:var(--c-primary);color:#fff;border-radius:10px;padding:.3rem .9rem;font-weight:700;font-size:.9rem;transition:background .15s}

  .empty{padding:1.5rem 1rem;text-align:center;color:var(--c-muted);background:var(--c-primary-tint);border-radius:12px}

  .note{margin-top:1.8rem;padding:.9rem 1.1rem;background:var(--c-primary-tint);border-radius:12px;font-size:.88rem;color:#475569;border:1px solid var(--c-border)}

  footer.credits{margin-top:2rem;padding-top:1.2rem;border-top:2px solid var(--c-border);text-align:center;font-size:.875rem;color:#475569;line-height:1.6}

  .support-cta{margin:1rem 0}
  .support-btn{display:inline-block;background:linear-gradient(to right,#facc15,#fb923c);color:#fff;font-weight:600;font-size:1rem;padding:.5rem 1.25rem;border-radius:9999px;box-shadow:0 4px 6px -1px rgba(0,0,0,.1),0 2px 4px -1px rgba(0,0,0,.06);text-decoration:none;transition:transform .2s ease}

  .tools-title{margin:10px 0 6px;font-size:.95rem;color:#888}

    .grade .g{font-size:1.8rem}
    .lessons{grid-template-columns:1fr}
    .crumb{font-size:1.3rem}
  }

/* ---------- 工具 ---------- */
const WM = "https://jinshuanyu.github.io/word-mapper/";
function listUrl(title, words){
  const json = JSON.stringify({ title: title, list: words });
  const b64 = btoa(unescape(encodeURIComponent(json)));
  return WM + "?list=" + encodeURIComponent(b64);
}
function esc(s){ const d=document.createElement("div"); d.textContent=s; return d.innerHTML; }
const $ = id => document.getElementById(id);
const stageOf = g => GRADES.find(x => x.items.includes(g)).stage;
const seriesOf = b => b.code.split(" ")[0];
const volOf = b => parseInt((b.code.match(/B(\d+)/) || [0, 0])[1], 10);
const CN = ["", "一","二","三","四","五","六","七","八","九","十","十一","十二"];
const booksFor = (g, p) => BOOKS.filter(b => b.grade === g && (!p || b.publisher === p))
                               .sort((a,b) => (a.term === "上" ? 0 : 1) - (b.term === "上" ? 0 : 1));
const booksOfSeries = (pub, code) => BOOKS.filter(b => b.publisher === pub && seriesOf(b) === code)
                                          .sort((a, b) => volOf(a) - volOf(b));
const GRADE_NUM = { "小三":3, "小四":4, "小五":5, "小六":6, "國一":7, "國二":8, "國三":9 };

function lessonCards(b){
  return b.lessons.map(([name, suffix, words]) => {
    const list = words.includes(",") ? words.split(",").map(s => s.trim()).filter(Boolean) : words.trim().split(/\s+/);
    return `<a class="lesson" href="${listUrl(b.code + suffix, list)}">
        <div class="lesson-top"><span class="lesson-name">${esc(name)}</span><span class="lesson-count">${list.length} 字</span></div>
        <div class="words">${esc(list.join(", "))}</div>
        <span class="open">開啟字表 →</span>
      </a>`;
  }).join("");
}

/* ---------- 首頁：國小＝出版社卡，國中＝年級卡 ---------- */
function renderHome(){
  const elem = `
    <div class="stage">
      <h2>國小</h2>
      <div class="pubcards">
        ${PUBLISHERS["國小"].map(p => `
          <button class="pubcard" type="button" data-pub="${esc(p)}">
            <span class="p">${esc(PUB_LABEL["國小"][p])}<small>版本</small></span>
            <div class="series">
              ${SERIES[p].map(s => {
                const bs = booksOfSeries(p, s.code);
                return `<span class="${bs.length ? "" : "todo"}">${esc(s.code)}</span>`;
              }).join("")}
            </div>
          </button>`).join("")}
      </div>
    </div>`;
  const jr = GRADES.filter(st => st.stage === "國中").map(st => `
    <div class="stage">
      <h2>${esc(st.stage)}</h2>
      <div class="grades">
        ${st.items.map(g => {
          const pubs = PUBLISHERS[st.stage];
          const any = booksFor(g).length > 0;
          return `<div class="grade ${any ? "" : "none"}">
                    <span class="g">${GRADE_NUM[g]}<small>年級</small></span>
                    <div class="pubs">
                      ${pubs.map(p => {
                        const ok = booksFor(g, p).length > 0;
                        return `<button class="pub wide" type="button"
                                  data-grade="${esc(g)}" data-pub="${esc(p)}" ${ok ? "" : "disabled"}>${esc(PUB_LABEL[st.stage][p])}</button>`;
                      }).join("")}
                    </div>
                  </div>`;
        }).join("")}
      </div>
    </div>`).join("");
  $("stages").innerHTML = elem + jr;
  $("stages").querySelectorAll(".pubcard").forEach(c => c.onclick = () => goPub(c.dataset.pub));
  $("stages").querySelectorAll(".pub:not(:disabled)").forEach(btn => btn.onclick = () => go(btn.dataset.grade, btn.dataset.pub));
}

/* ---------- 國小第二層：出版社 → 教材分頁 → 冊 ---------- */
function renderPub(pub, code, vol){
  const ser = SERIES[pub];
  const has = s => booksOfSeries(pub, s.code).length > 0;
  if (!code || !ser.some(s => s.code === code && has(s))) code = (ser.find(has) || ser[0]).code;
  $("crumb").innerHTML = esc(PUB_LABEL["國小"][pub]) + " 版 各課單字有聲字表<small>國小｜" + esc(YEAR) + "</small>";
  $("tabs").innerHTML = ser.map(s =>
    `<button class="tab" type="button" role="tab" data-code="${esc(s.code)}" aria-selected="${s.code === code}" ${has(s) ? "" : "disabled"}>${esc(s.code)}</button>`
  ).join("");
  $("tabs").querySelectorAll(".tab:not(:disabled)").forEach(t => t.onclick = () => goPub(pub, t.dataset.code));
  const books = booksOfSeries(pub, code);
  const vols = books.map(volOf);
  if (!vols.includes(vol)) vol = vols[0];
  const maxVol = Math.max(10, ...vols);   // 審定本 8 冊 + 非審定 9、10 冊
  const volBtns = Array.from({ length: maxVol }, (_, i) => i + 1).map(v =>
    `<button class="vol" type="button" data-vol="${v}" aria-selected="${v === vol}" ${vols.includes(v) ? "" : "disabled"}>${v}<small>冊</small></button>`
  ).join("");
  const b = books.find(x => volOf(x) === vol);
  $("books").innerHTML = `<p class="tip">各校開始的年級不同，請看課本封面的冊別。</p>
    <div class="vols">${volBtns}</div>` + (b ? `
    <section class="book">
      <div class="book-head"><h3>第${CN[volOf(b)]}冊</h3><span class="meta">${esc(b.code)}</span></div>
      <div class="lessons">${lessonCards(b)}</div>
    </section>` : `<div class="empty">這套教材還沒收錄</div>`);
  $("books").querySelectorAll(".vol:not(:disabled)").forEach(x => x.onclick = () => goPub(pub, code, +x.dataset.vol));
}

/* ---------- 國中第二層：年級 → 版本分頁（不變） ---------- */
function renderGrade(grade, pub){
  const pubs = PUBLISHERS[stageOf(grade)];
  const has = p => booksFor(grade, p).length > 0;
  if (!pub || !has(pub)) pub = pubs.find(has);
  $("crumb").innerHTML = GRADE_NUM[grade] + " 年級 各課單字有聲字表<small>" + esc(grade) + "｜" + esc(YEAR) + "</small>";
  $("tabs").innerHTML = pubs.map(p =>
    `<button class="tab" type="button" role="tab" data-pub="${esc(p)}" aria-selected="${p === pub}" ${has(p) ? "" : "disabled"}>${esc(PUB_LABEL["國中"][p])}</button>`
  ).join("");
  $("tabs").querySelectorAll(".tab:not(:disabled)").forEach(t => t.onclick = () => go(grade, t.dataset.pub));
  $("books").innerHTML = booksFor(grade, pub).map(b => `
    <section class="book">
      <div class="book-head"><h3>${esc(b.title)}（${esc(b.grade + b.term)}）</h3><span class="meta">${esc(b.code)}</span></div>
      <div class="lessons">${lessonCards(b)}</div>
    </section>`).join("") || `<div class="empty">這個年級還在整理中</div>`;
}

/* ---------- 網址記住位置 ---------- */
function go(grade, pub){ location.hash = grade ? encodeURIComponent(grade) + (pub ? "/" + encodeURIComponent(pub) : "") : ""; }
function goPub(pub, code, vol){ location.hash = "國小/" + encodeURIComponent(pub) + (code ? "/" + encodeURIComponent(code) + (vol ? "/" + vol : "") : ""); }
function route(){
  const parts = location.hash.slice(1).split("/").map(decodeURIComponent);
  let view = null;
  if (parts[0] === "國小" && PUBLISHERS["國小"].includes(parts[1])) view = () => renderPub(parts[1], parts[2], parseInt(parts[3], 10));
  else if (GRADES.some(x => x.items.includes(parts[0])) && booksFor(parts[0]).length) view = () => renderGrade(parts[0], parts[1]);
  $("viewGrades").hidden = !!view;
  $("viewGrade").hidden = !view;
  if (view) view(); else renderHome();
  window.scrollTo(0, 0);
}
$("backBtn").onclick = () => go("");
window.addEventListener("hashchange", route);
route();
</script>
