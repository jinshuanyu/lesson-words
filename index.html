<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>國中小英文 各課單字有聲字表｜Word Mapper</title>
<meta name="description" content="國小三年級到國中三年級英文各課單字有聲字表，一鍵開啟 Word Mapper 看每個字的拼字與聲音對照。" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Sans:wght@400;700;800&display=swap" rel="stylesheet" />
<style>
  :root{
    --c-primary:#887ea6; --c-primary-deep:#5f5582; --c-primary-soft:#efecf6; --c-primary-tint:#f6f4fa;
    --c-accent:#10b981;
    --c-text:#1f2937; --c-muted:#64748b; --c-bg:#f3f1f7; --c-border:#e6e2ee;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;overflow-x:hidden}
  body{font-family:"Noto Sans TC","Noto Sans",system-ui,sans-serif;background:var(--c-bg);color:var(--c-text);line-height:1.6;font-size:16px;padding:1.2rem 0 2rem}
  .container{max-width:880px;margin:0 auto;background:#fff;border-radius:20px;box-shadow:0 10px 30px rgba(95,85,130,.10);overflow:hidden}
  .inner{padding:1.5rem 1.6rem 2rem}

  /* ---- 首頁標題區 ---- */
  .hero{position:relative;padding:3.2rem 1.6rem 2rem;text-align:center;color:#fff;
    background:linear-gradient(135deg,#6e6392 0%,#887ea6 55%,#a79dc4 100%);overflow:hidden}
  .hero::before,.hero::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.08)}
  .hero::before{width:260px;height:260px;right:-80px;top:-120px}
  .hero::after{width:180px;height:180px;left:-60px;bottom:-100px}
  .hero > *{position:relative}
  .eyebrow{display:inline-block;font-size:.8rem;font-weight:700;letter-spacing:.18em;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:.2rem .9rem;margin-bottom:.9rem}
  .hero h1{font-size:2rem;font-weight:900;line-height:1.3;margin:0 0 .4rem;letter-spacing:.02em}
  .hero h1 small{display:block;font-size:1.05rem;font-weight:500;opacity:.92;margin-top:.3rem;letter-spacing:.08em}
  .hero .lead{color:rgba(255,255,255,.9);margin:.8rem 0 0;font-size:.98rem}
  .steps{display:flex;justify-content:center;align-items:center;gap:.45rem;flex-wrap:nowrap;margin-top:1.1rem}
  .step{display:inline-flex;align-items:center;gap:.4rem;background:rgba(255,255,255,.95);color:var(--c-primary-deep);border-radius:999px;padding:.35rem .9rem;font-size:.9rem;font-weight:700}
  .step b{display:inline-grid;place-items:center;width:1.35rem;height:1.35rem;border-radius:50%;background:var(--c-primary);color:#fff;font-size:.78rem}
  .step-arrow{color:rgba(255,255,255,.7);align-self:center;font-weight:700}
  .hero-back{position:absolute;left:1rem;top:.9rem;color:rgba(255,255,255,.9);font-size:.85rem;font-weight:700;text-decoration:none;background:rgba(0,0,0,.12);padding:.2rem .7rem;border-radius:999px}
  .hero-back:hover{background:rgba(0,0,0,.22)}

  button.back{display:inline-flex;align-items:center;gap:.3rem;margin-bottom:.9rem;color:var(--c-primary-deep);font-weight:700;background:var(--c-primary-soft);border:none;padding:.35rem .9rem;border-radius:999px;font:inherit;font-weight:700;cursor:pointer}
  button.back:hover{background:#e3dfee}

  /* ---- 年級 ---- */
  .stage{margin-bottom:1.5rem}
  .stage h2{display:flex;align-items:center;gap:.6rem;font-size:1rem;font-weight:900;color:var(--c-primary-deep);margin:0 0 .7rem;letter-spacing:.06em}
  .stage h2::after{content:"";flex:1;height:1px;background:var(--c-border)}
  .grades{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.8rem}
  .grade{min-width:0}
  .grade{border:2px solid var(--c-border);background:#fff;border-radius:16px;padding:.9rem .5rem .8rem;text-align:center;color:inherit}
  .grade .g{display:block;font-family:"Noto Sans",sans-serif;font-size:2rem;font-weight:800;line-height:1.1;color:#0f172a}
  .grade .g small{font-family:"Noto Sans TC",sans-serif;font-size:.8rem;font-weight:700;color:var(--c-muted);margin-left:.15rem}
  .pubs{display:flex;justify-content:center;gap:.35rem;margin-top:.6rem}
  .pub{display:inline-grid;place-items:center;width:2.1rem;height:2.1rem;border-radius:50%;font-size:.85rem;font-weight:700;border:2px solid var(--c-primary);background:#fff;color:var(--c-primary-deep);cursor:pointer;font-family:inherit;padding:0;transition:all .15s}
  .pub:hover:not(:disabled){background:var(--c-primary);color:#fff;transform:translateY(-1px);box-shadow:0 4px 10px rgba(136,126,166,.3)}
  .pub:disabled{border:1.5px dashed #cfcadb;color:#c4bfd2;cursor:default;background:#fbfafd}
  .grade.none{border-style:dashed;background:#faf9fc}
  .grade.none .g{color:#b4afc4}

  /* ---- 國小：出版社卡（版本 → 教材 → 冊） ---- */
  .pubcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:.8rem}
  .pubcard{border:2px solid var(--c-border);background:#fff;border-radius:16px;padding:1rem .9rem .9rem;text-align:center;cursor:pointer;transition:all .15s;font-family:inherit;font-size:inherit}
  .pubcard:hover{border-color:var(--c-primary);box-shadow:0 8px 18px rgba(136,126,166,.18);transform:translateY(-2px)}
  .pubcard .p{display:block;font-size:2rem;font-weight:900;line-height:1.1;color:#0f172a}
  .pubcard .p small{display:block;font-size:.78rem;font-weight:700;color:var(--c-muted);margin-top:.15rem}
  .series{display:flex;flex-wrap:wrap;justify-content:center;gap:.35rem;margin-top:.7rem}
  .series span{font-family:"Noto Sans",sans-serif;font-size:.8rem;font-weight:700;border-radius:999px;padding:.15rem .7rem;background:var(--c-primary-soft);color:var(--c-primary-deep)}
  .series span.todo{background:#fbfafd;border:1.5px dashed #cfcadb;color:#b4afc4}
  .tip{font-size:.85rem;color:var(--c-muted);margin:-.4rem 0 .8rem}
  .vols{display:flex;flex-wrap:wrap;gap:.4rem;margin:0 0 1.4rem}
  .vol{display:inline-flex;align-items:baseline;gap:.1rem;min-width:3.2rem;justify-content:center;border:2px solid var(--c-border);background:#fff;border-radius:12px;padding:.35rem .6rem;font-family:"Noto Sans",sans-serif;font-weight:800;font-size:1.05rem;color:#334155;cursor:pointer;transition:all .15s}
  .vol small{font-family:"Noto Sans TC",sans-serif;font-size:.72rem;font-weight:700}
  .vol:hover:not(:disabled){border-color:var(--c-primary);color:var(--c-primary-deep)}
  .vol[aria-selected="true"]{background:var(--c-primary);border-color:var(--c-primary);color:#fff;box-shadow:0 4px 10px rgba(136,126,166,.3)}
  .vol:disabled{opacity:.4;cursor:default;border-style:dashed}
  .pub.wide{width:auto;min-width:2.1rem;padding:0 .45rem;border-radius:999px;white-space:nowrap;font-size:.8rem}
  .festcard{grid-column:1 / -1;text-align:left;display:flex;align-items:center;gap:1rem;padding:.9rem 1.1rem}
  .festcard .p{font-size:2rem;flex:0 0 auto}
  .festcard .p small{font-size:.85rem;color:var(--c-primary-deep)}
  .festcard .series{margin-top:0;justify-content:flex-start}

  /* ---- 版本 ---- */
  .crumb{font-size:1.5rem;font-weight:900;margin:0 0 .2rem;color:#0f172a}
  .crumb small{display:block;font-size:.85rem;font-weight:500;color:var(--c-muted);letter-spacing:.05em}
  .tabs{display:flex;flex-wrap:wrap;gap:.5rem;margin:1rem 0 1.4rem}
  .tab{border:2px solid var(--c-border);background:#fff;border-radius:999px;padding:.4rem 1.2rem;font-weight:700;font-size:.95rem;color:#334155;cursor:pointer;font-family:inherit;transition:all .15s}
  .tab:hover:not(:disabled){border-color:var(--c-primary);color:var(--c-primary-deep)}
  .tab[aria-selected="true"]{background:var(--c-primary);border-color:var(--c-primary);color:#fff;box-shadow:0 4px 10px rgba(136,126,166,.3)}
  .tab:disabled{opacity:.45;cursor:default;border-style:dashed}

  .book{margin-bottom:2rem}
  .book-head{display:flex;flex-wrap:wrap;align-items:center;gap:.3rem .8rem;margin-bottom:.9rem;padding-left:.8rem;border-left:4px solid var(--c-primary)}
  .book-head h3{font-size:1.15rem;font-weight:900;margin:0;color:#0f172a}
  .book-head .meta{font-family:"Noto Sans",sans-serif;color:var(--c-muted);font-size:.82rem;font-weight:700;background:var(--c-primary-tint);border-radius:6px;padding:.1rem .5rem}

  .lessons{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:.9rem}
  .lesson{display:flex;flex-direction:column;gap:.55rem;border:1.5px solid var(--c-border);border-radius:14px;padding:.9rem 1rem;background:#fff;text-decoration:none;color:inherit;transition:border-color .15s,transform .1s,box-shadow .15s}
  .lesson:hover{border-color:var(--c-primary);box-shadow:0 8px 18px rgba(136,126,166,.18);transform:translateY(-2px)}
  .lesson-top{display:flex;justify-content:space-between;align-items:center;gap:.5rem}
  .lesson-name{font-weight:900;font-size:1.08rem;color:#0f172a}
  .lesson-count{font-size:.78rem;font-weight:700;color:var(--c-primary-deep);background:var(--c-primary-soft);border-radius:999px;padding:.05rem .55rem;white-space:nowrap}
  .words{font-family:"Noto Sans",sans-serif;font-size:.88rem;color:#475569;line-height:1.55;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .open{align-self:flex-start;background:var(--c-primary);color:#fff;border-radius:10px;padding:.3rem .9rem;font-weight:700;font-size:.9rem;transition:background .15s}
  .lesson:hover .open{background:var(--c-primary-deep)}
  .empty{padding:1.5rem 1rem;text-align:center;color:var(--c-muted);background:var(--c-primary-tint);border-radius:12px}

  /* ---- 每課配的兒歌／繪本影片 ---- */
  .lesson-foot{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
  .song{display:inline-flex;align-items:center;gap:.25rem;font-size:.82rem;font-weight:700;color:var(--c-primary-deep);background:var(--c-primary-soft);border-radius:10px;padding:.3rem .7rem;transition:background .15s,color .15s}
  .song:hover{background:#e3dfee}
  .pubv{display:inline-flex;align-items:center;gap:.25rem;font-size:.82rem;font-weight:700;color:#9a3412;background:#ffedd5;border-radius:10px;padding:.3rem .7rem;transition:background .15s}
  .pubv:hover{background:#fed7aa}
  .topic-head{display:flex;align-items:center;gap:.7rem;margin:0 0 .8rem}
  .topic-head .e{display:grid;place-items:center;flex:0 0 auto;width:2.8rem;height:2.8rem;border-radius:14px;background:var(--c-primary);color:#fff;font-size:1.5rem}
  .topic-head h3{font-size:1.4rem;font-weight:900;margin:0;line-height:1.25;color:#0f172a}
  .topic-head h3 small{display:block;font-size:.85rem;font-weight:500;color:var(--c-muted)}
  .player{position:relative;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:#000;box-shadow:0 10px 24px rgba(95,85,130,.18)}
  .player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  .vlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:.6rem;margin-top:.9rem}
  .v{display:flex;gap:.6rem;align-items:center;border:1.5px solid var(--c-border);border-radius:12px;padding:.45rem;background:#fff;cursor:pointer;text-align:left;font-family:inherit;font-size:inherit;color:inherit}
  .v:hover{border-color:var(--c-primary)}
  .v[aria-current="true"]{border-color:var(--c-primary);background:var(--c-primary-tint);box-shadow:0 0 0 2px var(--c-primary-soft)}
  .v img{width:96px;aspect-ratio:16/9;object-fit:cover;border-radius:8px;flex:0 0 auto}
  .v .t{font-size:.86rem;font-weight:700;line-height:1.3}
  .v .t small{display:block;font-weight:400;color:var(--c-muted);font-size:.75rem}
  .v .k{font-size:.68rem;font-weight:700;color:var(--c-primary-deep);background:var(--c-primary-soft);border-radius:999px;padding:0 .45rem;margin-right:.3rem}
  .topic-lessons{display:flex;flex-wrap:wrap;gap:.4rem;margin:.4rem 0 1rem}
  .topic-lessons a{font-size:.82rem;font-weight:700;color:var(--c-primary-deep);background:var(--c-primary-soft);border-radius:999px;padding:.15rem .7rem;text-decoration:none}
  .topic-lessons a:hover{background:var(--c-primary);color:#fff}
  .topic-lessons a.here{background:var(--c-primary);color:#fff}
  .ytlink{font-size:.85rem;color:var(--c-muted)}
  .ytlink a{color:var(--c-primary-deep);font-weight:700}
  .sub{display:flex;align-items:center;gap:.6rem;font-size:.95rem;font-weight:900;color:var(--c-primary-deep);margin:1.2rem 0 .5rem;letter-spacing:.06em}
  .sub::after{content:"";flex:1;height:1px;background:var(--c-border)}

  .note{margin-top:1.8rem;padding:.9rem 1.1rem;background:var(--c-primary-tint);border-radius:12px;font-size:.88rem;color:#475569;border:1px solid var(--c-border)}
  .note p{margin:.2rem 0}
  /* ---- footer：與 Word Mapper 相同結構（聯絡 / 贊助 / 工具互連 / 版權） ---- */
  footer.credits{margin-top:2rem;padding-top:1.2rem;border-top:2px solid var(--c-border);text-align:center;font-size:.875rem;color:#475569;line-height:1.6}
  .credits .contact a{color:#64748b;margin:0 .5rem;text-decoration:none;transition:color .2s}
  .credits .contact a:hover{color:var(--c-primary-deep)}
  .support-cta{margin:1rem 0}
  .support-btn{display:inline-block;background:linear-gradient(to right,#facc15,#fb923c);color:#fff;font-weight:600;font-size:1rem;padding:.5rem 1.25rem;border-radius:9999px;box-shadow:0 4px 6px -1px rgba(0,0,0,.1),0 2px 4px -1px rgba(0,0,0,.06);text-decoration:none;transition:transform .2s ease}
  .support-btn:hover{transform:scale(1.05)}
  .support-btn:focus{outline:3px solid rgba(251,191,36,.45);outline-offset:2px}
  .tools-title{margin:10px 0 6px;font-size:.95rem;color:#888}
  .tools{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:0 auto 12px}
  .tools a{display:inline-block;padding:6px 14px;background:var(--c-primary-soft);color:var(--c-primary-deep);text-decoration:none;border-radius:20px;font-size:1rem;font-weight:500}
  .tools a:hover{background:var(--c-primary);color:#fff}
  @media (max-width:640px){.support-btn{font-size:.9rem;font-weight:500;padding:.45rem 1rem}}
  [hidden]{display:none!important}

  @media (max-width:640px){
    body{padding:0}
    .container{border-radius:0;box-shadow:none}
    .inner{padding:1.2rem 16px 2rem}
    .hero{padding:3.6rem 16px 1.6rem}
    .hero h1{font-size:1.55rem}
    .hero h1 small{font-size:.95rem}
    .step{padding:.3rem .7rem;font-size:.85rem}
    .grades{grid-template-columns:repeat(2,1fr)}
    .pubcards{grid-template-columns:repeat(3,1fr)}
    .pubcard .p{font-size:1.7rem}
    .pubcard{padding:.8rem .3rem .7rem}
    .series{gap:.3rem}
    .series span{font-size:.74rem;padding:.1rem .45rem}  /* 讓 HWG、HR 兩顆排在同一行，三張卡一樣高 */
    .grade .g{font-size:1.8rem}
    .lessons{grid-template-columns:1fr}
    .crumb{font-size:1.3rem}
    .vlist{grid-template-columns:1fr}
    .topic-head h3{font-size:1.2rem}
  }
</style>
</head>

<script>
/* ============================================================
   新增課本：在 BOOKS 加一個物件即可，頁面會自己長出年級、版本、連結。
   grade    ：年級（要跟 GRADES 裡的名稱一樣，例 "小三"、"國一"）
   term     ："上" 或 "下"
   publisher：版本（例 "康軒"、"翰林"、"南一"、"何嘉仁"）
   code     ：字表標題前綴（例 "HWG B1"）
   lessons  ：[ 課名, 標題後綴, "單字 用空白隔開" ]
              標題 = code + 後綴（"HWG B1" + "L1" → "HWG B1L1"）
   句型請把單字照順序連著寫，例如 "good morning"。
   ============================================================ */
const YEAR = "115 學年度";

const GRADES = [
  { stage: "國小", items: ["小三", "小四", "小五", "小六"] },
  { stage: "國中", items: ["國一", "國二", "國三"] }
];
const PUBLISHERS = {
  "國小": ["康軒", "翰林", "何嘉仁"],
  "國中": ["康軒", "翰林", "南一"]
};
/* 國小每家出版社的教材（代碼）：審定本 + 低年級教材。BOOKS 裡還沒有的會顯示「尚未收錄」 */
const SERIES = {
  "康軒":   [{ code: "WW" }, { code: "SS" }],
  "翰林":   [{ code: "HWG" }, { code: "HR" }],
  "何嘉仁": [{ code: "SF" }, { code: "FW" }]
};
const PUB_LABEL = { "國小": { "康軒":"康", "翰林":"翰", "何嘉仁":"何" },
                    "國中": { "康軒":"康", "翰林":"翰（佳）", "南一":"南" } };

const BOOKS = [
  {
    grade: "小三", term: "上", publisher: "翰林",
    title: "HWG 第一冊", code: "HWG B1",

/* ---------- 工具 ---------- */
const WM = "https://jinshuanyu.github.io/word-mapper/";
function listUrl(title, words){
  const json = JSON.stringify({ title: title, list: words });
  const b64 = btoa(unescape(encodeURIComponent(json)));
  return WM + "?list=" + encodeURIComponent(b64);
}
function esc(s){ const d=document.createElement("div"); d.textContent=s; return d.innerHTML; }
const $ = id => document.getElementById(id);
const stageOf = g => GRADES.find(x => x.items.includes(g)).stage;
const seriesOf = b => b.code.split(" ")[0];
const volOf = b => parseInt((b.code.match(/B(\d+)/) || [0, 0])[1], 10);
const CN = ["", "一","二","三","四","五","六","七","八","九","十","十一","十二"];
const booksFor = (g, p) => BOOKS.filter(b => b.grade === g && (!p || b.publisher === p))
                               .sort((a,b) => (a.term === "上" ? 0 : 1) - (b.term === "上" ? 0 : 1));
const booksOfSeries = (pub, code) => BOOKS.filter(b => b.publisher === pub && seriesOf(b) === code)
                                          .sort((a, b) => volOf(a) - volOf(b));
const GRADE_NUM = { "小三":3, "小四":4, "小五":5, "小六":6, "國一":7, "國二":8, "國三":9 };

function lessonCards(b){
  return b.lessons.map(([name, suffix, words]) => {
    const list = words.includes(",") ? words.split(",").map(s => s.trim()).filter(Boolean) : words.trim().split(/\s+/);
    const song = topicsOf(b.code, name).map(tid =>
      `<span class="song" data-topic="${esc(tid)}" data-code="${esc(b.code)}" data-lesson="${esc(name)}">🎵 ${esc(TOPICS[tid].name)}</span>`).join("");
    const pubv = (PUB_VIDEO[b.code + "|" + name] || []).map(([id, label]) =>
      `<span class="pubv" data-yt="${esc(id)}" title="在 YouTube 開啟">📺 ${esc(label)}</span>`).join("");
    return `<a class="lesson" href="${listUrl(b.code + suffix, list)}">
        <div class="lesson-top"><span class="lesson-name">${esc(name)}</span><span class="lesson-count">${list.length} 字</span></div>
        <div class="words">${esc(list.join(", "))}</div>
        <div class="lesson-foot"><span class="open">開啟字表 →</span>${song}${pubv}</div>
      </a>`;
  }).join("");
}
/* 🎵 / 📺 按鈕在 <a> 裡面：攔下點擊，改去影片頁或 YouTube */
document.addEventListener("click", e => {
  const s = e.target.closest(".song"), p = e.target.closest(".pubv");
  if (!s && !p) return;
  e.preventDefault(); e.stopPropagation();
  if (p) window.open(p.dataset.yt.startsWith("PL") ? "https://www.youtube.com/playlist?list=" + p.dataset.yt : "https://www.youtube.com/watch?v=" + p.dataset.yt, "_blank", "noopener");
  else location.hash = "主題/" + encodeURIComponent(s.dataset.topic) + "/" + encodeURIComponent(s.dataset.code) + "/" + encodeURIComponent(s.dataset.lesson);
});

/* 某一冊在網站上的位置（給「其他課也用得到」的連結用） */
function bookHash(b){
  return b.grade.startsWith("國") ? encodeURIComponent(b.grade) + "/" + encodeURIComponent(b.publisher)
       : "國小/" + encodeURIComponent(b.publisher) + "/" + encodeURIComponent(seriesOf(b)) + "/" + volOf(b);
}
function renderTopic(tid, code, lesson, idx){
  const t = TOPICS[tid]; if (!t) return renderHome();
  idx = idx || 0;
  const ids = t.videos.map(v => v[0]);
  const src = t.yt ? `https://www.youtube.com/embed/videoseries?list=${t.yt}&rel=0`
            : `https://www.youtube.com/embed/${ids[idx]}?playlist=${ids.slice(idx + 1).concat(ids.slice(0, idx)).join(",")}&rel=0`;
  const ytUrl = t.yt ? `https://www.youtube.com/playlist?list=${t.yt}` : `https://www.youtube.com/watch_videos?video_ids=${ids.join(",")}`;
  const uses = [];
  BOOKS.forEach(b => b.lessons.forEach(([name]) => { if (topicsOf(b.code, name).includes(tid)) uses.push({ b, name }); }));
  const here = uses.find(u => u.b.code === code && u.name === lesson);
  const fest = code === "節日" ? FESTIVALS.find(f => f.id === tid) : null;
  const from = here ? `${esc(here.b.code)} ${esc(here.name)} · ` : fest ? "節日主題 · " : "";
  $("topic").innerHTML = `
    <div class="topic-head"><span class="e">${t.e}</span>
      <h3>${from}${esc(t.name)} ${esc(t.en)}<small>兒歌、繪本朗讀${t.videos.length ? " " + t.videos.length + " 部" : ""} · 一部播完自動接下一部</small></h3></div>
    <div class="player"><iframe src="${src}" title="${esc(t.name)}" loading="lazy" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe></div>
    ${t.videos.length ? `<div class="vlist">${t.videos.map((v, i) =>
      `<button class="v" type="button" data-i="${i}" aria-current="${i === idx}"><img src="https://i.ytimg.com/vi/${v[0]}/mqdefault.jpg" alt="" loading="lazy"><span class="t"><span class="k">${esc(v[3])}</span>${esc(v[1])}<small>${esc(v[2])}</small></span></button>`).join("")}</div>` : ""}
    <p class="ytlink" style="margin-top:.8rem">想在 YouTube 開：<a href="${ytUrl}" target="_blank" rel="noopener noreferrer">播放整個清單 ↗</a></p>
    <div class="sub">📖 這些課也用得到</div>
    <div class="topic-lessons">${FESTIVALS.some(f => f.id === tid) ? `<a href="#節日" class="${fest ? "here" : ""}">🎉 節日主題字表</a>` : ""}${uses.map(u => `<a href="#${bookHash(u.b)}" class="${u === here ? "here" : ""}">${esc(u.b.code)} ${esc(u.name)}</a>`).join("")}</div>`;
  $("topic").querySelectorAll(".v").forEach(v => v.onclick = () => renderTopic(tid, code, lesson, +v.dataset.i));
  $("topicBack").onclick = () => { if (here) location.hash = bookHash(here.b); else if (fest) location.hash = "節日"; else go(""); };
}

                    </div>
                  </div>`;
        }).join("")}
      </div>
    </div>`).join("");
  const fest = `
    <div class="stage">
      <h2>節日</h2>
      <div class="pubcards">
        <button class="pubcard festcard" type="button" id="festBtn">
          <span class="p">🎉<small>節日主題字表</small></span>
          <div class="series">${FESTIVALS.map(f => `<span>${TOPICS[f.id] ? TOPICS[f.id].e + " " : ""}${esc(f.name)}</span>`).join("")}</div>
        </button>
      </div>
    </div>`;
  $("stages").innerHTML = elem + jr + fest;
  $("festBtn").onclick = () => { location.hash = "節日"; };
  $("stages").querySelectorAll(".pubcard[data-pub]").forEach(c => c.onclick = () => goPub(c.dataset.pub));
  $("stages").querySelectorAll(".pub:not(:disabled)").forEach(btn => btn.onclick = () => go(btn.dataset.grade, btn.dataset.pub));
}

/* ---------- 國小第二層：出版社 → 教材分頁 → 冊 ---------- */
function renderPub(pub, code, vol){
  const ser = SERIES[pub];
  const has = s => booksOfSeries(pub, s.code).length > 0;
  if (!code || !ser.some(s => s.code === code && has(s))) code = (ser.find(has) || ser[0]).code;
  $("crumb").innerHTML = esc(PUB_LABEL["國小"][pub]) + " 版 各課單字有聲字表<small>國小｜" + esc(YEAR) + "</small>";
  $("tabs").innerHTML = ser.map(s =>
    `<button class="tab" type="button" role="tab" data-code="${esc(s.code)}" aria-selected="${s.code === code}" ${has(s) ? "" : "disabled"}>${esc(s.code)}</button>`
  ).join("");
  $("tabs").querySelectorAll(".tab:not(:disabled)").forEach(t => t.onclick = () => goPub(pub, t.dataset.code));
  const books = booksOfSeries(pub, code);
  const vols = books.map(volOf);
  if (!vols.includes(vol)) vol = vols[0];
  const maxVol = Math.max(10, ...vols);   // 審定本 8 冊 + 非審定 9、10 冊
  const volBtns = Array.from({ length: maxVol }, (_, i) => i + 1).map(v =>
    `<button class="vol" type="button" data-vol="${v}" aria-selected="${v === vol}" ${vols.includes(v) ? "" : "disabled"}>${v}<small>冊</small></button>`
  ).join("");
  const b = books.find(x => volOf(x) === vol);
  $("books").innerHTML = `<p class="tip">各校開始的年級不同，請看課本封面的冊別。</p>
    <div class="vols">${volBtns}</div>` + (b ? `
    <section class="book">
      <div class="book-head"><h3>第${CN[volOf(b)]}冊</h3><span class="meta">${esc(b.code)}</span></div>
      <div class="lessons">${lessonCards(b)}</div>
    </section>` : `<div class="empty">這套教材還沒收錄</div>`);
  $("books").querySelectorAll(".vol:not(:disabled)").forEach(x => x.onclick = () => goPub(pub, code, +x.dataset.vol));
}

/* ---------- 國中第二層：年級 → 版本分頁（不變） ---------- */
function renderGrade(grade, pub){
  const pubs = PUBLISHERS[stageOf(grade)];
  const has = p => booksFor(grade, p).length > 0;
  if (!pub || !has(pub)) pub = pubs.find(has);
  $("crumb").innerHTML = GRADE_NUM[grade] + " 年級 各課單字有聲字表<small>" + esc(grade) + "｜" + esc(YEAR) + "</small>";
  $("tabs").innerHTML = pubs.map(p =>
    `<button class="tab" type="button" role="tab" data-pub="${esc(p)}" aria-selected="${p === pub}" ${has(p) ? "" : "disabled"}>${esc(PUB_LABEL["國中"][p])}</button>`
  ).join("");
  $("tabs").querySelectorAll(".tab:not(:disabled)").forEach(t => t.onclick = () => go(grade, t.dataset.pub));
  $("books").innerHTML = booksFor(grade, pub).map(b => `
    <section class="book">
      <div class="book-head"><h3>${esc(b.title)}（${esc(b.grade + b.term)}）</h3><span class="meta">${esc(b.code)}</span></div>
      <div class="lessons">${lessonCards(b)}</div>
    </section>`).join("") || `<div class="empty">這個年級還在整理中</div>`;
}

/* ---------- 網址記住位置 ---------- */
function go(grade, pub){ location.hash = grade ? encodeURIComponent(grade) + (pub ? "/" + encodeURIComponent(pub) : "") : ""; }
function goPub(pub, code, vol){ location.hash = "國小/" + encodeURIComponent(pub) + (code ? "/" + encodeURIComponent(code) + (vol ? "/" + vol : "") : ""); }
function route(){
  const parts = location.hash.slice(1).split("/").map(decodeURIComponent);
  let view = null, topic = null;
  if (parts[0] === "主題" && TOPICS[parts[1]]) topic = () => renderTopic(parts[1], parts[2], parts[3]);
  else if (parts[0] === "節日") view = renderFestivals;
  else if (parts[0] === "國小" && PUBLISHERS["國小"].includes(parts[1])) view = () => renderPub(parts[1], parts[2], parseInt(parts[3], 10));
  else if (GRADES.some(x => x.items.includes(parts[0])) && booksFor(parts[0]).length) view = () => renderGrade(parts[0], parts[1]);
  $("viewGrades").hidden = !!(view || topic);
  $("viewGrade").hidden = !view;
  $("viewTopic").hidden = !topic;
  if (topic) topic(); else if (view) view(); else renderHome();
  window.scrollTo(0, 0);
}
$("backBtn").onclick = () => go("");
window.addEventListener("hashchange", route);
route();
</script>
